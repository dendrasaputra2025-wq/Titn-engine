<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Trading Engine v22.0 Ultimate</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-dark: #020510;
            --panel-bg: #0b1021;
            --border-color: rgba(0, 240, 255, 0.2);
            --neon-blue: #00f0ff;
            --neon-green: #00ff66;
            --neon-red: #ff0055;
            --neon-yellow: #ffea00;
            --text-main: #e2e8f0;
            --text-dim: #7c90b3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .titan-card { width: 100%; max-width: 480px; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; box-shadow: 0 0 20px rgba(0, 240, 255, 0.05); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .audio-controls { display: flex; gap: 6px; }
        .btn-audio { background: rgba(0, 240, 255, 0.1); border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 4px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-audio.off { background: rgba(255, 255, 255, 0.05); border-color: var(--text-dim); color: var(--text-dim); }
        .status-badge { font-size: 11px; font-weight: bold; color: var(--neon-yellow); }
        .style-selector { display: flex; gap: 6px; margin-bottom: 12px; }
        .style-btn { flex: 1; padding: 8px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-dim); font-size: 11px; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; }
        .style-btn.active { background: rgba(0, 240, 255, 0.15); border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }
        .pair-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        select { background: #060a17; color: var(--neon-blue); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; outline: none; }
        .tf-container { display: flex; gap: 4px; }
        .tf-btn { padding: 4px 8px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-dim); font-size: 10px; border-radius: 4px; cursor: pointer; }
        .tf-btn.active { background: var(--neon-blue); color: #000; border-color: var(--neon-blue); font-weight: bold; }
        .price-section { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
        .pair-title { font-size: 13px; color: var(--text-dim); font-weight: 600; }
        .live-price { font-size: 20px; font-weight: 900; color: #fff; font-family: monospace; }
        #tvChart { width: 100%; height: 260px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 12px; background: #020510; }
        .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 12px; }
        .metric-box { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); padding: 6px 8px; border-radius: 6px; }
        .metric-label { font-size: 9px; color: var(--text-dim); margin-bottom: 2px; }
        .metric-value { font-size: 11px; font-weight: bold; color: #fff; }
        .signal-box { background: rgba(255, 255, 255, 0.02); border: 1px dashed rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 8px; text-align: center; }
        .signal-box.buy-sig { background: rgba(0, 255, 102, 0.08); border: 1px solid var(--neon-green); }
        .signal-box.sell-sig { background: rgba(255, 0, 85, 0.08); border: 1px solid var(--neon-red); }
        .txt-green { color: var(--neon-green); }
        .txt-red { color: var(--neon-red); }
    </style>
</head>
<body>

    <div class="titan-card">
        <div class="top-bar">
            <div class="audio-controls">
                <button id="btnVoice" class="btn-audio" onclick="toggleVoice()">🎙️ VOICE: ON</button>
                <button id="btnBeep" class="btn-audio" onclick="toggleBeep()">🔔 ALARM: ON</button>
                <button class="btn-audio" onclick="testAudio()" style="border-color:var(--text-dim); color:var(--text-dim);">TEST</button>
            </div>
            <div id="wsStatus" class="status-badge">CONNECTING...</div>
        </div>

        <div class="style-selector">
            <div id="btnScalp" class="style-btn active" onclick="setStyle('scalp')">⚡ SCALPING</div>
            <div id="btnDay" class="style-btn" onclick="setStyle('day')">📊 DAY TRADE</div>
            <div id="btnSwing" class="style-btn" onclick="setStyle('swing')">🌊 SWING</div>
        </div>

        <div class="pair-bar">
            <select id="pairSelect" onchange="changeSymbol()">
                <option value="paxgusdt">PAXG/USDT (GOLD)</option>
                <option value="btcusdt">BTC/USDT</option>
                <option value="ethusdt">ETH/USDT</option>
                <option value="solusdt">SOL/USDT</option>
            </select>
            <div id="tfContainer" class="tf-container"></div>
        </div>

        <div class="price-section">
            <div id="pairLabel" class="pair-title">PAXGUSDT | SCALP MODE</div>
            <div id="livePrice" class="live-price">$0.00</div>
        </div>

        <div id="tvChart"></div>

        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-label">HTF BIAS</div>
                <div id="htfInfo" class="metric-value">Syncing...</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">VOLUME DELTA</div>
                <div id="deltaInfo" class="metric-value">Analyzing...</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">LIQUIDITY SWEEP</div>
                <div id="sweepInfo" class="metric-value">Scanning...</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">FIBONACCI OTE</div>
                <div id="oteInfo" class="metric-value">Calculating...</div>
            </div>
        </div>

        <div id="signalOutput" class="signal-box">
            <div style="color:var(--text-dim); font-size: 11px;">⏳ SCANNING 24/7 CONFLUENCE...</div>
        </div>
    </div>

    <script>
    let symbol = 'paxgusdt';
    let currentStyle = 'scalp';
    let timeframe = '5m';
    let htfInterval = '1h';
    let ws = null;
    let candles = [];
    let htfBias = 'NEUTRAL';
    let pendingCandleUpdate = null;
    let renderScheduled = false;
    let reconnectTimer = null;
    let currentRequestId = 0; 

    let voiceEnabled = true;
    let beepEnabled = true;
    let lastSignalType = null;
    let lastSignalTime = 0;
    let audioCtx = null;

    let chart = null, candleSeries = null, ema9Series = null, ema21Series = null, vwapSeries = null;
    let slLine = null, tp1Line = null, tp2Line = null; // Horizontal Price Lines

    const styleConfigs = {
        scalp: { tfs: ['1m', '5m'], defaultTF: '5m', htf: '1h', atrMult: 1.2, rr1: 1.5, rr2: 2.5, minScore: 80 },
        day: { tfs: ['15m', '1h'], defaultTF: '15m', htf: '4h', atrMult: 2.0, rr1: 2.0, rr2: 3.5, minScore: 85 },
        swing: { tfs: ['1h', '4h'], defaultTF: '4h', htf: '1d', atrMult: 3.0, rr1: 3.0, rr2: 5.0, minScore: 85 }
    };

    function toggleVoice() {
        voiceEnabled = !voiceEnabled;
        const btn = document.getElementById('btnVoice');
        btn.innerText = voiceEnabled ? "🎙️ VOICE: ON" : "🎙️ VOICE: OFF";
        btn.classList.toggle('off', !voiceEnabled);
    }

    function toggleBeep() {
        beepEnabled = !beepEnabled;
        const btn = document.getElementById('btnBeep');
        btn.innerText = beepEnabled ? "🔔 ALARM: ON" : "🔔 ALARM: OFF";
        btn.classList.toggle('off', !beepEnabled);
    }

    function speakText(text) {
        if (!voiceEnabled || !('speechSynthesis' in window)) return;
        try {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 1.0;
            utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        } catch(e) {}
    }

    function playCyberAlarm(type) {
        if (!beepEnabled) return;
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(audioCtx.destination);

            let now = audioCtx.currentTime;
            if (type === 'buy') {
                osc1.frequency.setValueAtTime(440, now);
                osc1.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                osc2.frequency.setValueAtTime(554.37, now + 0.15);
                osc2.frequency.exponentialRampToValueAtTime(1108.73, now + 0.3);
            } else {
                osc1.frequency.setValueAtTime(987.77, now);
                osc1.frequency.exponentialRampToValueAtTime(493.88, now + 0.15);
                osc2.frequency.setValueAtTime(659.25, now + 0.15);
                osc2.frequency.exponentialRampToValueAtTime(329.63, now + 0.3);
            }

            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

            osc1.start(now);
            osc2.start(now + 0.15);
            osc1.stop(now + 0.35);
            osc2.stop(now + 0.35);
        } catch (e) {}
    }

    function testAudio() {
        playCyberAlarm('buy');
        speakText("Titan Audio Engine operational.");
    }

    function triggerAudioAlert(type, pairName, price) {
        let now = Date.now();
        if (now - lastSignalTime > 30000 || lastSignalType !== type) {
            lastSignalTime = now;
            lastSignalType = type;
            playCyberAlarm(type);
            let cleanPair = pairName.replace('usdt', '').toUpperCase();
            setTimeout(() => speakText(`Titan Signal. ${type.toUpperCase()} ${cleanPair} at ${price}`), 300);
        }
    }

    function renderTFButtons() {
        const container = document.getElementById('tfContainer');
        if (!container) return;
        container.innerHTML = '';
        const config = styleConfigs[currentStyle];
        config.tfs.forEach(tf => {
            const btn = document.createElement('div');
            btn.className = `tf-btn ${tf === timeframe ? 'active' : ''}`;
            btn.innerText = tf.toUpperCase();
            btn.onclick = () => setTF(tf, btn);
            container.appendChild(btn);
        });
    }

    function setStyle(style) {
        if(currentStyle === style && candles.length > 0) return;
        currentStyle = style;
        document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
        if(style === 'scalp') document.getElementById('btnScalp').classList.add('active');
        if(style === 'day') document.getElementById('btnDay').classList.add('active');
        if(style === 'swing') document.getElementById('btnSwing').classList.add('active');

        const config = styleConfigs[style];
        timeframe = config.defaultTF;
        htfInterval = config.htf;
        renderTFButtons();
        startStream();
    }

    function initChartOnce() {
        const el = document.getElementById('tvChart');
        if (!el || chart) return;
        
        chart = LightweightCharts.createChart(el, {
            width: el.clientWidth,
            height: 260,
            layout: { backgroundColor: '#020510', textColor: '#7c90b3' },
            grid: { vertLines: { color: 'rgba(255,255,255,0.02)' }, horzLines: { color: 'rgba(255,255,255,0.02)' } },
            priceScale: { borderColor: 'rgba(0,240,255,0.2)' },
            timeScale: { visible: true, timeVisible: true, secondsVisible: false }
        });

        candleSeries = chart.addCandlestickSeries({
            upColor: '#00ff66', downColor: '#ff0055',
            borderUpColor: '#00ff66', borderDownColor: '#ff0055',
            wickUpColor: '#00ff66', wickDownColor: '#ff0055'
        });

        ema9Series = chart.addLineSeries({ color: '#00f0ff', lineWidth: 1 });
        ema21Series = chart.addLineSeries({ color: '#ff0055', lineWidth: 1 });
        vwapSeries = chart.addLineSeries({ color: '#ffea00', lineWidth: 1.5 });

        window.addEventListener('resize', resizeChart);
    }

    function clearPriceLines() {
        if (candleSeries) {
            if (slLine) { candleSeries.removePriceLine(slLine); slLine = null; }
            if (tp1Line) { candleSeries.removePriceLine(tp1Line); tp1Line = null; }
            if (tp2Line) { candleSeries.removePriceLine(tp2Line); tp2Line = null; }
        }
    }

    function drawTargetLines(sl, tp1, tp2) {
        clearPriceLines();
        if (!candleSeries) return;

        slLine = candleSeries.createPriceLine({ price: sl, color: '#ff0055', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: 'SL' });
        tp1Line = candleSeries.createPriceLine({ price: tp1, color: '#00ff66', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: 'TP1' });
        tp2Line = candleSeries.createPriceLine({ price: tp2, color: '#00ff66', lineWidth: 1.5, lineStyle: 0, axisLabelVisible: true, title: 'TP2' });
    }

    function resetChartSeries() {
        clearPriceLines();
        if(candleSeries) candleSeries.setData([]);
        if(ema9Series) ema9Series.setData([]);
        if(ema21Series) ema21Series.setData([]);
        if(vwapSeries) vwapSeries.setData([]);
    }

    function resizeChart() {
        if (chart && document.getElementById('tvChart')) {
            chart.applyOptions({ width: document.getElementById('tvChart').clientWidth });
        }
    }

    function setTF(tf, btn) {
        if (timeframe === tf) return;
        timeframe = tf;
        document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        startStream();
    }

    function changeSymbol() {
        const selectEl = document.getElementById("pairSelect");
        if (selectEl) {
            symbol = selectEl.value;
            lastSignalType = null;
            startStream();
        }
    }

    async function fetchHTFBias(requestId) {
        try {
            const res = await fetch(`https://data-api.binance.vision/api/v3/klines?symbol=${symbol.toUpperCase()}&interval=${htfInterval}&limit=20`);
            if(!res.ok) throw new Error("HTTP Error");
            const data = await res.json();
            if (requestId !== currentRequestId) return; 
            if (!Array.isArray(data) || data.length === 0) return;
            
            const closes = data.map(d => parseFloat(d[4]));
            const ema20 = closes.reduce((a,b)=>a+b,0)/closes.length;
            const last = closes[closes.length - 1];
            htfBias = last > ema20 ? `BULLISH 🟢 (${htfInterval.toUpperCase()})` : `BEARISH 🔴 (${htfInterval.toUpperCase()})`;
            
            const htfInfoEl = document.getElementById("htfInfo");
            if (htfInfoEl) {
                htfInfoEl.innerText = `${htfBias} | Buffer: ${styleConfigs[currentStyle].atrMult}x ATR`;
            }
        } catch(e) {
            const htfInfoEl = document.getElementById("htfInfo");
            if (htfInfoEl) htfInfoEl.innerText = "HTF Bias: Standby";
        }
    }

    async function fetchKlines(requestId) {
        try {
            const res = await fetch(`https://data-api.binance.vision/api/v3/klines?symbol=${symbol.toUpperCase()}&interval=${timeframe}&limit=100`);
            if(!res.ok) throw new Error("HTTP Error");
            const data = await res.json();
            
            if (requestId !== currentRequestId) return; 
            if (!Array.isArray(data) || data.length === 0) return;

            let rawCandles = data.map(d => ({
                time: Math.floor(d[0] / 1000),
                open: parseFloat(d[1]), high: parseFloat(d[2]),
                low: parseFloat(d[3]), close: parseFloat(d[4]), vol: parseFloat(d[5]),
                takerVol: parseFloat(d[9])
            }));

            const uniqueMap = new Map();
            rawCandles.forEach(c => uniqueMap.set(c.time, c));
            candles = Array.from(uniqueMap.values()).sort((a, b) => a.time - b.time);

            if(candles.length > 0 && candleSeries) {
                candleSeries.setData(candles.map(c => ({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close })));
                analyzeChart();
            }
        } catch(e) {
            console.warn("REST Klines warning, waiting for WS...");
        }
    }

    function calcEMA(period) {
        if (!candles || candles.length === 0) return [];
        let k = 2 / (period + 1);
        let ema = candles[0].close;
        let res = [];
        for (let i = 0; i < candles.length; i++) {
            let c = candles[i];
            if (typeof c.close !== 'number' || isNaN(c.close)) continue;
            ema = (c.close * k) + (ema * (1 - k));
            res.push({ time: c.time, value: ema });
        }
        return res;
    }

    function scheduleRender() {
        if (renderScheduled) return;
        renderScheduled = true;
        requestAnimationFrame(() => {
            if (pendingCandleUpdate && candleSeries) {
                try {
                    candleSeries.update({
                        time: pendingCandleUpdate.time,
                        open: pendingCandleUpdate.open,
                        high: pendingCandleUpdate.high,
                        low: pendingCandleUpdate.low,
                        close: pendingCandleUpdate.close
                    });
                    analyzeChart();
                } catch(e) {
                    console.warn("Update candle skipped due to timestamp sync");
                }
                pendingCandleUpdate = null;
            }
            renderScheduled = false;
        });
    }

    function analyzeChart() {
        if (!candles || candles.length < 10) return;

        const config = styleConfigs[currentStyle];
        const len = candles.length;
        const curr = candles[len - 1];
        const decimals = (symbol === 'btcusdt') ? 1 : 2;

        const livePriceEl = document.getElementById("livePrice");
        const pairLabelEl = document.getElementById("pairLabel");
        if (livePriceEl) livePriceEl.innerText = `$${curr.close.toFixed(decimals)}`;
        if (pairLabelEl) pairLabelEl.innerText = `${symbol.toUpperCase()} | ${currentStyle.toUpperCase()} MODE (${timeframe.toUpperCase()})`;

        let delta = curr.takerVol - (curr.vol - curr.takerVol);
        let prevClose = candles[len - 2] ? candles[len - 2].close : curr.close;
        let isDeltaBuy = (curr.close < prevClose) && (delta > 0);
        let isDeltaSell = (curr.close > prevClose) && (delta < 0);
        
        const deltaInfoEl = document.getElementById("deltaInfo");
        if (deltaInfoEl) {
            deltaInfoEl.innerText = isDeltaBuy ? "🔥 Bullish Absorption" : (isDeltaSell ? "🔥 Bearish Absorption" : (delta > 0 ? `Buyer (+${delta.toFixed(1)})` : `Seller (${delta.toFixed(1)})`));
        }

        let sliceCount = Math.min(30, candles.length);
        let last30 = candles.slice(-sliceCount);
        let last30High = Math.max(...last30.map(c => c.high));
        let last30Low = Math.min(...last30.map(c => c.low));
        let isSweepBuy = curr.low < last30Low && curr.close > last30Low;
        let isSweepSell = curr.high > last30High && curr.close < last30High;
        
        const sweepInfoEl = document.getElementById("sweepInfo");
        if (sweepInfoEl) {
            sweepInfoEl.innerText = isSweepBuy ? "⚡ Low Swept!" : (isSweepSell ? "⚡ High Swept!" : "No Sweep");
        }

        let swingCount = Math.min(20, candles.length);
        let last20 = candles.slice(-swingCount);
        let swingHigh = Math.max(...last20.map(c => c.high));
        let swingLow = Math.min(...last20.map(c => c.low));
        let fibRange = swingHigh - swingLow;
        let fib618 = swingHigh - (fibRange * 0.618);
        let fib786 = swingHigh - (fibRange * 0.786);
        let inOTEZone = (curr.close >= fib786 && curr.close <= fib618);
        
        const oteInfoEl = document.getElementById("oteInfo");
        if (oteInfoEl) {
            oteInfoEl.innerText = inOTEZone ? `🎯 DISCOUNT` : "Outside OTE Zone";
        }

        const ema9 = calcEMA(9);
        const ema21 = calcEMA(21);
        if(ema9Series && ema9.length) ema9Series.setData(ema9);
        if(ema21Series && ema21.length) ema21Series.setData(ema21);

        // IMPR: Anchored VWAP (Reset Tiap Hari Baru / Sesi 00:00 UTC)
        let totalTPV = 0, totalVol = 0, lastDay = -1;
        let vwapData = candles.map(c => {
            let candleDay = new Date(c.time * 1000).getUTCDate();
            if (lastDay !== -1 && candleDay !== lastDay) {
                totalTPV = 0; totalVol = 0; // Hard Reset harian
            }
            lastDay = candleDay;

            totalTPV += ((c.high + c.low + c.close) / 3) * c.vol;
            totalVol += (c.vol || 0.00001);
            return { time: c.time, value: totalTPV / totalVol };
        });
        if(vwapSeries && vwapData.length) vwapSeries.setData(vwapData);

        // IMPR: Volatility Check via ATR Filter
        let trSlice = candles.slice(-14);
        let trs = trSlice.map((c, i) => Math.max(c.high - c.low, Math.abs(c.high - (trSlice[i-1]?.close || c.close))));
        let rawAtr = trs.reduce((a,b) => a+b, 0) / (trs.length || 1);
        let atr = Math.max(rawAtr, curr.close * 0.0005); 
        let currentCandleRange = curr.high - curr.low;
        let isMarketActive = currentCandleRange >= (atr * 0.7); // Volatilitas cukup

        let buyScore = 0, sellScore = 0;
        if (htfBias.includes("BULLISH")) buyScore += 25;
        if (htfBias.includes("BEARISH")) sellScore += 25;
        if (isSweepBuy) buyScore += 30;
        if (isSweepSell) sellScore += 30;
        if (isDeltaBuy) buyScore += 20;
        if (isDeltaSell) sellScore += 20;
        if (inOTEZone && htfBias.includes("BULLISH")) buyScore += 15;

        const out = document.getElementById("signalOutput");
        if (!out) return;
        
        let slDistance = atr * config.atrMult;

        if(buyScore >= config.minScore && htfBias.includes("BULLISH") && isMarketActive) {
            let sl = curr.close - slDistance;
            let tp1 = curr.close + slDistance * config.rr1;
            let tp2 = curr.close + slDistance * config.rr2;

            out.className = "signal-box buy-sig";
            out.innerHTML = `
                <div class="txt-green" style="font-size:14px; font-weight:900">🟢 ${currentStyle.toUpperCase()} BUY SIGNAL (${buyScore}%)</div>
                <div style="margin-top:4px; font-size:10px">
                    <b>Entry:</b> $${curr.close.toFixed(decimals)} | <b>SL:</b> $${sl.toFixed(decimals)}<br>
                    <b>TP1:</b> $${tp1.toFixed(decimals)} | <b>TP2:</b> $${tp2.toFixed(decimals)}
                </div>
            `;
            drawTargetLines(sl, tp1, tp2);
            triggerAudioAlert('buy', symbol, curr.close.toFixed(decimals));
        } else if(sellScore >= config.minScore && htfBias.includes("BEARISH") && isMarketActive) {
            let sl = curr.close + slDistance;
            let tp1 = curr.close - slDistance * config.rr1;
            let tp2 = curr.close - slDistance * config.rr2;

            out.className = "signal-box sell-sig";
            out.innerHTML = `
                <div class="txt-red" style="font-size:14px; font-weight:900">🔴 ${currentStyle.toUpperCase()} SELL SIGNAL (${sellScore}%)</div>
                <div style="margin-top:4px; font-size:10px">
                    <b>Entry:</b> $${curr.close.toFixed(decimals)} | <b>SL:</b> $${sl.toFixed(decimals)}<br>
                    <b>TP1:</b> $${tp1.toFixed(decimals)} | <b>TP2:</b> $${tp2.toFixed(decimals)}
                </div>
            `;
            drawTargetLines(sl, tp1, tp2);
            triggerAudioAlert('sell', symbol, curr.close.toFixed(decimals));
        } else {
            clearPriceLines();
            out.className = "signal-box";
            out.innerHTML = `<div style="color:#7c90b3">⏳ SCANNING 24/7 CONFLUENCE... (Buy: ${buyScore}% | Sell: ${sellScore}%)</div>`;
            lastSignalType = null;
        }
    }

    async function startStream() {
        if (reconnectTimer) clearTimeout(reconnectTimer);
        
        currentRequestId++;
        let requestId = currentRequestId;

        if (ws) {
            ws.onopen = null;
            ws.onmessage = null;
            ws.onerror = null;
            ws.onclose = null;
            ws.close();
            ws = null;
        }

        candles = [];
        resetChartSeries(); 
        renderTFButtons();
        
        const wsStatusEl = document.getElementById("wsStatus");
        if (wsStatusEl) {
            wsStatusEl.innerText = "SYNCING...";
            wsStatusEl.style.color = "var(--neon-yellow)";
        }

        await fetchHTFBias(requestId);
        await fetchKlines(requestId);

        if (requestId !== currentRequestId) return; 

        if (chart && candles.length > 0) {
            try { chart.timeScale().fitContent(); } catch(e) {}
        }

        ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@kline_${timeframe}`);
        
        ws.onopen = () => { 
            if (wsStatusEl) {
                wsStatusEl.innerText = "LIVE 24/7"; 
                wsStatusEl.style.color = "var(--neon-green)";
            }
        };

        ws.onmessage = (evt) => {
            try {
                let msg = JSON.parse(evt.data);
                if(msg.k) {
                    let k = msg.k;
                    let candleTime = Math.floor(k.t / 1000);
                    
                    pendingCandleUpdate = {
                        time: candleTime,
                        open: parseFloat(k.o), high: parseFloat(k.h),
                        low: parseFloat(k.l), close: parseFloat(k.c), vol: parseFloat(k.v),
                        takerVol: parseFloat(k.V)
                    };

                    if(candles.length > 0) {
                        let lastCandle = candles[candles.length - 1];
                        if (lastCandle.time === candleTime) {
                            candles[candles.length - 1] = pendingCandleUpdate;
                        } else if (candleTime > lastCandle.time) {
                            candles.push(pendingCandleUpdate);
                            if(candles.length > 150) candles.shift();
                            fetchHTFBias(currentRequestId);
                        }
                    } else {
                        candles.push(pendingCandleUpdate);
                    }
                    scheduleRender();
                }
            } catch(err) {}
        };

        ws.onclose = () => {
            if (wsStatusEl) {
                wsStatusEl.innerText = "RECONNECTING...";
                wsStatusEl.style.color = "var(--neon-yellow)";
            }
            reconnectTimer = setTimeout(startStream, 3000);
        };

        ws.onerror = () => {
            if(ws) ws.close();
        };
    }

    document.body.addEventListener('click', () => {
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }, { once: true });

    window.onload = () => {
        initChartOnce();
        setStyle('scalp');
    };
    </script>
</body>
</html>
